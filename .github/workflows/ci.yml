name: CI/CD Pipeline - WalletPay API

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker access
        run: |
          docker version
          docker info
          ls -la /var/run/docker.sock

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and test
        env:
          MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
        run: |
          ./mvnw clean verify \
            -Dtestcontainers.ryuk.disabled=true \
            -Dtestcontainers.docker.socket.override=/var/run/docker.sock \
            -Dorg.testcontainers.docker.socket.override=/var/run/docker.sock
